<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Maker</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0b0d10;
  --panel: #12161b;
  --panel2: #181e25;
  --line: #303943;
  --text: #edf2f7;
  --muted: #8995a3;
  --accent: #63d8ff;
  --good: #78e08f;
  --warn: #ffd166;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

.app {
  width: min(1200px, 100%);
  margin: auto;
  padding: 12px;
}

/* HEADER */

header {
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 14px;
}

.logo {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: .08em;
}

.sub {
  color: var(--muted);
  font-size: .75rem;
  margin-top: 3px;
}

/* TABS */

.tabs {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  overflow-x: auto;
}

.tab {
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
}

.tab.active {
  color: var(--text);
  border-color: var(--accent);
}

/* EDITOR */

.editor {
  margin-top: 8px;
  border: 1px solid var(--line);
  background: #080a0d;
}

textarea {
  width: 100%;
  height: 230px;
  resize: vertical;
  border: 0;
  outline: none;
  padding: 16px;
  background: transparent;
  color: #dce7ef;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 14px;
  line-height: 1.55;
}

/* CONTROLS */

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 9px 0;
}

button {
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text);
  padding: 9px 13px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 700;
}

button:hover {
  border-color: var(--accent);
}

#testBtn {
  border-color: var(--good);
}

#publishBtn {
  border-color: var(--warn);
}

/* PREVIEW */

.preview {
  margin-top: 8px;
  border: 1px solid var(--line);
  background: white;
  color: black;
  min-height: 260px;
}

.preview-title {
  background: var(--panel);
  color: var(--muted);
  padding: 8px 12px;
  font-size: .72rem;
  letter-spacing: .08em;
}

iframe {
  width: 100%;
  height: 280px;
  border: 0;
  display: block;
}

/* LOWER GRID */

.lower {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.panel {
  border: 1px solid var(--line);
  background: var(--panel);
  min-height: 310px;
}

.panel-title {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: .75rem;
  font-weight: 800;
  letter-spacing: .08em;
}

/* KEYBOARD */

.keyboard {
  padding: 18px;
  text-align: center;
}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, 55px);
  justify-content: center;
  gap: 5px;
  margin-bottom: 18px;
}

.key {
  height: 48px;
  border: 1px solid var(--line);
  background: #202730;
  color: white;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  user-select: none;
  touch-action: manipulation;
}

.key:active,
.key.active {
  border-color: var(--accent);
  transform: translateY(1px);
}

.blank {
  visibility: hidden;
}

.ab {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 22px;
}

.ab .key {
  width: 65px;
}

.target {
  border-top: 1px solid var(--line);
  padding-top: 15px;
  color: var(--muted);
}

.target span {
  display: inline-block;
  margin: 5px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--text);
}

/* T ENGINE */

.engine {
  position: relative;
  height: 255px;
  overflow: hidden;
  background:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 32px 32px;
}

.axis {
  position: absolute;
  opacity: .45;
  pointer-events: none;
}

.axis.x {
  left: 0;
  right: 0;
  top: 50%;
  border-top: 1px dashed var(--accent);
}

.axis.y {
  top: 0;
  bottom: 0;
  left: 50%;
  border-left: 1px dashed var(--accent);
}

.stick {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42px;
  height: 85px;
  transform: translate(-50%, -50%);
  transition: left .08s linear, top .08s linear;
}

.head {
  width: 20px;
  height: 20px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  margin: auto;
}

.body {
  width: 2px;
  height: 28px;
  background: var(--accent);
  margin: auto;
}

.arm,
.leg {
  position: absolute;
  width: 25px;
  height: 2px;
  background: var(--accent);
  left: 8px;
  transform-origin: left center;
}

.arm {
  top: 31px;
}

.arm.left {
  transform: rotate(150deg);
}

.arm.right {
  transform: rotate(30deg);
}

.leg {
  top: 58px;
}

.leg.left {
  transform: rotate(115deg);
}

.leg.right {
  transform: rotate(65deg);
}

.engine-label {
  position: absolute;
  right: 10px;
  bottom: 8px;
  color: var(--muted);
  font: 11px monospace;
}

/* STATUS */

.status {
  margin-top: 8px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  font: 12px monospace;
}

/* MOBILE */

@media (max-width: 700px) {
  .lower {
    grid-template-columns: 1fr;
  }

  textarea {
    height: 190px;
  }

  .preview iframe {
    height: 240px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">CODE MAKER</div>
  <div class="sub">CODE AS INSTRUMENT • LOCAL BUILD ENVIRONMENT</div>

  <div class="tabs">
    <button class="tab active" data-lang="html">HTML</button>
    <button class="tab" data-lang="css">CSS</button>
    <button class="tab" data-lang="js">JS</button>
    <button class="tab" data-lang="theory">CODE THEORY</button>
  </div>
</header>

<section class="editor">
<textarea id="editor" spellcheck="false"></textarea>
</section>

<div class="controls">
  <button id="quantizeBtn">QUANTIZE</button>
  <button id="buildBtn">BUILD</button>
  <button id="testBtn">TEST</button>
  <button id="publishBtn">PUBLISH</button>
</div>

<section class="preview">
  <div class="preview-title">MAIN PREVIEW • YOUR APP</div>
  <iframe id="preview"></iframe>
</section>

<section class="lower">

  <!-- KEYBOARD -->

  <div class="panel">
    <div class="panel-title">KEYBOARD PREVIEW</div>

    <div class="keyboard">

      <div class="dpad">
        <div class="key blank"></div>
        <div class="key" data-key="ArrowUp">↑</div>
        <div class="key blank"></div>

        <div class="key" data-key="ArrowLeft">←</div>
        <div class="key" data-key="ArrowDown">↓</div>
        <div class="key" data-key="ArrowRight">→</div>
      </div>

      <div class="ab">
        <div class="key" data-key="a">A</div>
        <div class="key" data-key="b">B</div>
      </div>

      <div class="target">
        TARGET:
        <br>
        <span>T ENGINE</span>
        <span>MAIN</span>
      </div>

    </div>
  </div>

  <!-- T ENGINE -->

  <div class="panel">
    <div class="panel-title">T ENGINE</div>

    <div class="engine" id="engine">

      <div class="axis x"></div>
      <div class="axis y"></div>

      <div class="stick" id="stick">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="engine-label">
        X Y Z T
      </div>

    </div>
  </div>

</section>

<div class="status" id="status">
READY • LOCAL MODE
</div>

</div>

<script>

/* =========================================================
   CODE MAKER DATA
   ========================================================= */

const code = {

html: `<div id="app">
  <h1>My App</h1>
  <p>Build something.</p>
  <button onclick="hello()">PRESS</button>
</div>`,

css: `body {
  font-family: system-ui;
  padding: 30px;
}

h1 {
  letter-spacing: 2px;
}`,

js: `function hello() {
  alert("Hello from Code Maker");
}`,

theory: `// CODE THEORY

// HTML = structure
// CSS  = appearance
// JS   = behavior

// INPUT
// ↓
// FUNCTION
// ↓
// OUTPUT

// T ENGINE = movement / interaction anchor
// KEYBOARD  = instrument layer
// MAIN      = application layer
`
};

let currentLanguage = "html";

/* =========================================================
   EDITOR
   ========================================================= */

const editor = document.getElementById("editor");
const status = document.getElementById("status");

function loadEditor() {
  editor.value = code[currentLanguage];
}

function saveEditor() {
  code[currentLanguage] = editor.value;
}

document.querySelectorAll(".tab").forEach(tab => {

  tab.addEventListener("click", () => {

    saveEditor();

    document
      .querySelectorAll(".tab")
      .forEach(t => t.classList.remove("active"));

    tab.classList.add("active");

    currentLanguage = tab.dataset.lang;

    loadEditor();

    status.textContent =
      "EDITOR • " + currentLanguage.toUpperCase();
  });

});

loadEditor();

/* =========================================================
   BUILD ENGINE
   ========================================================= */

function build() {

  saveEditor();

  const html = code.html;
  const css = `<style>${code.css}</style>`;
  const js = `<script>${code.js.replace(/<\/script>/gi, "<\\/script>")}<\/script>`;

  const documentString = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      ${css}
    </head>
    <body>
      ${html}
      ${js}
    </body>
    </html>
  `;

  document.getElementById("preview").srcdoc = documentString;

  localStorage.setItem(
    "codeMakerProject",
    JSON.stringify(code)
  );

  status.textContent =
    "BUILD COMPLETE • PROJECT SAVED LOCALLY";
}

document.getElementById("buildBtn")
  .addEventListener("click", build);

/* =========================================================
   QUANTIZE
   ========================================================= */

function quantize() {

  saveEditor();

  let value = editor.value;

  /*
    Quantize is intentionally conservative.
    It does not rewrite the programmer's logic.
    It normalizes whitespace and indentation.
  */

  value = value
    .replace(/\r\n/g, "\n")
    .replace(/[ \t]+$/gm, "")
    .replace(/\n{3,}/g, "\n\n");

  editor.value = value;
  code[currentLanguage] = value;

  status.textContent =
    "QUANTIZED • SYNTAX PRESERVED";
}

document.getElementById("quantizeBtn")
  .addEventListener("click", quantize);

/* =========================================================
   TEST
   ========================================================= */

function test() {

  saveEditor();

  try {

    if (currentLanguage === "js") {
      new Function(editor.value);
    }

    if (currentLanguage === "html") {
      const parser = new DOMParser();
      const result = parser.parseFromString(
        editor.value,
        "text/html"
      );

      if (result.querySelector("parsererror")) {
        throw new Error("HTML parse error");
      }
    }

    status.textContent =
      "TEST PASSED • NO BASIC SYNTAX ERROR DETECTED";

  } catch (error) {

    status.textContent =
      "TEST ERROR • " + error.message;
  }
}

document.getElementById("testBtn")
  .addEventListener("click", test);

/* =========================================================
   PUBLISH
   ========================================================= */

document.getElementById("publishBtn")
  .addEventListener("click", () => {

    saveEditor();

    const project = JSON.stringify(code, null, 2);

    const blob = new Blob(
      [project],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "code-maker-project.json";

    a.click();

    URL.revokeObjectURL(url);

    status.textContent =
      "PUBLISHED • PROJECT CARTRIDGE EXPORTED";
  });

/* =========================================================
   T ENGINE
   ========================================================= */

const engine = document.getElementById("engine");
const stick = document.getElementById("stick");

let x = 50;
let y = 50;

function move(dx, dy) {

  x += dx;
  y += dy;

  x = Math.max(8, Math.min(92, x));
  y = Math.max(12, Math.min(88, y));

  stick.style.left = x + "%";
  stick.style.top = y + "%";
}

function activateKey(key) {

  const button =
    document.querySelector(`[data-key="${key}"]`);

  if (button) {
    button.classList.add("active");

    setTimeout(() => {
      button.classList.remove("active");
    }, 100);
  }

  switch (key) {

    case "ArrowUp":
      move(0, -5);
      break;

    case "ArrowDown":
      move(0, 5);
      break;

    case "ArrowLeft":
      move(-5, 0);
      break;

    case "ArrowRight":
      move(5, 0);
      break;

    case "a":
      status.textContent = "T ENGINE • A ACTION";
      break;

    case "b":
      status.textContent = "T ENGINE • B ACTION";
      break;
  }
}

document.addEventListener("keydown", event => {

  const allowed = [
    "ArrowUp",
    "ArrowDown",
    "ArrowLeft",
    "ArrowRight",
    "a",
    "b"
  ];

  if (allowed.includes(event.key)) {

    event.preventDefault();

    activateKey(event.key);
  }

});

document.querySelectorAll("[data-key]")
  .forEach(button => {

    button.addEventListener("pointerdown", () => {
      activateKey(button.dataset.key);
    });

  });

/* =========================================================
   LOAD LOCAL PROJECT
   ========================================================= */

const saved =
  localStorage.getItem("codeMakerProject");

if (saved) {

  try {

    const parsed = JSON.parse(saved);

    Object.assign(code, parsed);

    loadEditor();

    status.textContent =
      "LOCAL PROJECT RESTORED";

  } catch {

    status.textContent =
      "READY • NEW LOCAL PROJECT";
  }
}

</script>

</body>
</html>
