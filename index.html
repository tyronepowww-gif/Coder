<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantized Code Maker</title>

<style>
*{box-sizing:border-box}

:root{
  --header-height:58px;
  --toolbar-height:58px;
  --panel-padding:12px;
  --border:#333;
  --panel:#151515;
  --input:#090909;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#111;
  color:#eee;
  font-family:system-ui,sans-serif;
}

body{
  overflow-x:hidden;
}

header{
  min-height:var(--header-height);
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

header h1{
  margin:0;
  font-size:18px;
}

button{
  border:1px solid #444;
  background:#1c1c1c;
  color:#eee;
  padding:9px 12px;
  border-radius:7px;
  cursor:pointer;
}

button:hover{
  background:#292929;
}

.toolbar{
  min-height:var(--toolbar-height);
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  padding:10px;
  border-bottom:1px solid var(--border);
}

.workspace{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:1px;
  background:var(--border);
  min-height:calc(100vh - var(--header-height) - var(--toolbar-height));
}

.panel{
  background:var(--panel);
  padding:var(--panel-padding);
  min-width:0;
}

.panel h2{
  font-size:13px;
  margin:0 0 8px;
  color:#aaa;
  text-transform:uppercase;
  letter-spacing:.08em;
}

textarea,
.code{
  display:block;
  width:100%;
  min-height:260px;
  resize:vertical;
  background:var(--input);
  color:#d7d7d7;
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
  font-family:monospace;
  font-size:13px;
  line-height:1.5;
  white-space:pre;
  overflow:auto;
}

.code{
  min-height:230px;
}

#preview{
  display:block;
  width:100%;
  height:420px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
}

.report{
  background:var(--input);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
  font-family:monospace;
  font-size:12px;
  line-height:1.6;
  white-space:pre-wrap;
}

.pass{color:#79d279}
.warn{color:#e6c56a}
.fail{color:#e27777}

.status{
  font-size:12px;
  color:#aaa;
  white-space:nowrap;
}

.live-preview{
  grid-column:1 / -1;
  grid-row:1;
  min-width:0;
  background:#151515;
  padding:var(--panel-padding);
}

.live-preview #preview{
  height:clamp(260px,42vw,520px);
  min-height:260px;
}

.source-panel{
  grid-column:1;
  grid-row:2;
}

.output-panel{
  grid-column:2;
  grid-row:2;
}

@media (max-width:900px){
  .workspace{
    grid-template-columns:minmax(0,1fr);
  }

  .live-preview,
  .source-panel,
  .output-panel{
    grid-column:1;
  }

  .live-preview{grid-row:1}
  .source-panel{grid-row:2}
  .output-panel{grid-row:3}
}

@media (max-width:600px){
  :root{
    --panel-padding:9px;
  }

  header{
    padding:11px 12px;
  }

  header h1{
    font-size:15px;
  }

  .toolbar{
    padding:8px;
    gap:6px;
  }

  button{
    padding:8px 9px;
    font-size:12px;
  }

  textarea,
  .code{
    min-height:210px;
    font-size:12px;
  }

  .live-preview #preview{
    height:clamp(240px,70vw,360px);
  }
}
</style>
</head>

<body>

<header>
  <h1>QUANTIZED CODE MAKER</h1>
  <span class="status" id="status">READY</span>
</header>

<div class="toolbar">
  <button data-plugin="IF(condition)">IF</button>
  <button data-plugin="Keyboard(move up down left right, A, B)">Keyboard</button>
  <button data-plugin="PLAYER(control,walk,state)">Player</button>
  <button data-plugin="GRID(perspective,horizon)">Grid</button>
  <button data-plugin="PHYSICS">Physics</button>
  <button data-plugin="3RD PERSON POV">3rd Person</button>
  <button data-plugin="STATE(x,y,z,t)">State</button>
  <button data-plugin="TIME ENGINE">T Engine</button>
  <button data-plugin="-quantize to html">Target HTML</button>
  <button id="quantizeButton">QUANTIZE</button>
  <button id="buildButton">BUILD</button>
  <button id="testButton">TEST</button>
</div>

<div class="workspace">

  <section class="panel live-preview">
    <h2>Live Preview</h2>
    <iframe id="preview" title="Generated live preview"></iframe>
  </section>

  <section class="panel source-panel">
    <h2>Source</h2>

    <textarea id="source">IF(condition)
Keyboard(move up down left right, A, B)
-quantize to html</textarea>

    <h2>Quantized Composition</h2>
    <textarea id="quantized" readonly></textarea>

    <h2>Correction Report</h2>
    <div id="report" class="report">READY</div>
  </section>

  <section class="panel output-panel">
    <h2>HTML</h2>
    <textarea id="htmlCode" class="code" readonly></textarea>

    <h2>CSS</h2>
    <textarea id="cssCode" class="code" readonly></textarea>

    <h2>JavaScript</h2>
    <textarea id="jsCode" class="code" readonly></textarea>

    <h2>T — Time Engine</h2>
    <textarea id="tCode" class="code" readonly></textarea>
  </section>

</div>

<script>
const KNOWN_INSTRUMENTS = new Set([
  "IF",
  "ELSE",
  "KEYBOARD",
  "PLAYER",
  "GRID",
  "PHYSICS",
  "3RD PERSON POV",
  "STATE",
  "TIME ENGINE",
  "TIMER",
  "DELAY",
  "INTERVAL",
  "ANIMATION",
  "SEQUENCE",
  "TIMELINE",
  "PLAYBACK"
]);

const elements = {
  source: document.getElementById("source"),
  quantized: document.getElementById("quantized"),
  report: document.getElementById("report"),
  htmlCode: document.getElementById("htmlCode"),
  cssCode: document.getElementById("cssCode"),
  jsCode: document.getElementById("jsCode"),
  tCode: document.getElementById("tCode"),
  preview: document.getElementById("preview"),
  status: document.getElementById("status")
};

function insertPlugin(text){
  const current = elements.source.value.trim();

  elements.source.value =
    current ? `${elements.source.value}\n${text}` : text;

  elements.source.focus();
}

function parseSource(source){
  const lines = source
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(Boolean);

  const result = {
    instruments: [],
    target: null
  };

  lines.forEach(line => {
    const targetMatch =
      line.match(/^-\s*quantize\s+to\s+(.+)$/i);

    if(targetMatch){
      result.target = targetMatch[1].trim().toLowerCase();
      return;
    }

    const match =
      line.match(/^([A-Za-z0-9 \-]+?)(?:\((.*)\))?$/);

    if(!match){
      result.instruments.push({
        name: line.toUpperCase(),
        args: "",
        valid: false
      });
      return;
    }

    const name = match[1].trim().toUpperCase();

    result.instruments.push({
      name,
      args: match[2] || "",
      valid: KNOWN_INSTRUMENTS.has(name)
    });
  });

  return result;
}

function quantize(){
  const parsed = parseSource(elements.source.value);
  const canonical = [];
  const report = [];
  const names = parsed.instruments.map(item => item.name);

  parsed.instruments.forEach(item => {
    if(!item.valid){
      report.push(`[FAIL] UNKNOWN INSTRUMENT: ${item.name}`);
      return;
    }

    if(item.name === "KEYBOARD"){
      canonical.push(
`KEYBOARD(
    ${normalizeKeyboardArgs(item.args)}
)`
      );
    }else if(item.name === "IF"){
      canonical.push(
`IF(
    ${item.args || "condition"}
)`
      );
    }else if(item.name === "STATE"){
      canonical.push(
`STATE(
    ${item.args || "x,y,z,t"}
)`
      );
    }else{
      canonical.push(formatInstrument(item));
    }

    report.push(`[PASS] ${item.name}`);
  });

  if(names.includes("KEYBOARD")){
    canonical.push(
`DEPENDENCY(
    HTML,
    CSS,
    JS
)`
    );

    report.push("[PASS] KEYBOARD DEPENDENCIES");
  }

  const target = parsed.target || "html";

  canonical.push(
`TARGET(
    ${target.toUpperCase()}
)`
  );

  report.push(
    parsed.target
      ? `[PASS] TARGET = ${target.toUpperCase()}`
      : "[WARN] No target specified → TARGET(HTML)"
  );

  if(names.includes("IF")){
    report.push(
      "[WARN] IF condition is explicit input; no hidden condition is created"
    );
  }

  if(names.includes("STATE") && !names.includes("TIME ENGINE")){
    report.push("[PASS] STATE uses finite runtime state updates");
  }

  report.push("");
  report.push("QUANTIZATION: COMPLETE");

  elements.quantized.value = canonical.join("\n\n");
  elements.report.innerHTML = report
    .map(formatReportLine)
    .join("\n");

  generate(parsed);
  setStatus("QUANTIZED");
}

function normalizeKeyboardArgs(args){
  if(!args.trim()){
    return "move(up,down,left,right), A, B";
  }

  const clean = args.replace(/\s+/g, " ").trim();

  const directions = clean.match(
    /move\s+((?:(?:up|down|left|right)\s*)+)/i
  );

  if(!directions){
    return clean;
  }

  const values = directions[1]
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .map(value => value.toLowerCase());

  const remainder = clean
    .replace(directions[0], "")
    .replace(/^,\s*/, "")
    .trim();

  return `move(${values.join(",")})` +
    (remainder ? `, ${remainder}` : "");
}

function formatInstrument(item){
  return item.args
    ? `${item.name}(${item.args})`
    : item.name;
}

function generate(parsed){
  const names = parsed.instruments.map(item => item.name);
  const output = createOutput(names);

  elements.htmlCode.value = output.html.trim();
  elements.cssCode.value = output.css.trim();
  elements.jsCode.value = output.js.trim();
  elements.tCode.value = output.t.trim();

  updatePreview(output.html, output.css, output.js);
}

function createOutput(names){
  const hasKeyboard = names.includes("KEYBOARD");
  const hasPlayer = names.includes("PLAYER");
  const hasGrid = names.includes("GRID");
  const hasIf = names.includes("IF");
  const hasTime = names.includes("TIME ENGINE") || names.includes("STATE");

  const html = createHTML(hasKeyboard, hasPlayer, hasGrid);
  const css = createCSS();
  const js = createJavaScript({
    hasKeyboard,
    hasPlayer,
    hasIf,
    hasTime
  });
  const t = hasTime ? createTimeDescription() : "";

  return {html, css, js, t};
}

function createHTML(hasKeyboard, hasPlayer, hasGrid){
  let html = `<div id="app">\n`;

  if(hasKeyboard){
    html += `
  <section class="keyboard-system" data-instrument="KEYBOARD">
    <div class="movement">
      <button data-action="up" aria-label="Move up">↑</button>
      <div>
        <button data-action="left" aria-label="Move left">←</button>
        <button data-action="down" aria-label="Move down">↓</button>
        <button data-action="right" aria-label="Move right">→</button>
      </div>
    </div>

    <div class="action-bar">
      <button data-action="A">A</button>
      <button data-action="B">B</button>
    </div>

    <div id="output">READY</div>
  </section>
`;
  }

  if(hasPlayer){
    html += `
  <div id="player" data-instrument="PLAYER">
    PLAYER
  </div>
`;
  }

  if(hasGrid){
    html += `
  <div id="grid-layer" data-instrument="GRID" aria-hidden="true"></div>
`;
  }

  return `${html}</div>`;
}

function createCSS(){
  return `
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:#111;
  color:white;
  font-family:system-ui,sans-serif;
}

#app{
  position:relative;
  width:min(600px,94vw);
  max-width:100%;
  min-height:220px;
  padding:clamp(14px,4vw,28px);
  overflow:hidden;
}

.keyboard-system{
  position:relative;
  z-index:2;
  display:grid;
  gap:clamp(14px,4vw,20px);
  justify-items:center;
  width:100%;
}

.movement{
  display:grid;
  gap:6px;
  text-align:center;
}

.movement button,
.action-bar button{
  width:clamp(52px,14vw,70px);
  height:clamp(44px,12vw,55px);
  border:1px solid #555;
  background:#222;
  color:white;
  border-radius:8px;
  font-size:clamp(17px,4vw,20px);
  cursor:pointer;
}

.movement button:active,
.action-bar button:active{
  transform:scale(.94);
}

.action-bar{
  display:flex;
  gap:clamp(8px,3vw,12px);
  max-width:100%;
}

.action-bar button{
  width:clamp(90px,28vw,120px);
}

#output{
  width:min(100%,360px);
  min-height:30px;
  padding:10px 14px;
  border:1px solid #333;
  border-radius:8px;
  text-align:center;
  overflow-wrap:anywhere;
}

#player{
  position:relative;
  z-index:3;
  margin:clamp(20px,5vw,30px) auto;
  width:clamp(70px,18vw,100px);
  height:clamp(70px,18vw,100px);
  display:grid;
  place-items:center;
  border:2px solid white;
  border-radius:50%;
}

#grid-layer{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(#777 1px,transparent 1px),
    linear-gradient(90deg,#777 1px,transparent 1px);
  background-size:
    clamp(24px,7vw,42px)
    clamp(24px,7vw,42px);
}

@media (max-width:420px){
  #app{
    width:100%;
    padding:12px;
  }

  #output{
    font-size:12px;
  }
}
`;
}

function createJavaScript(options){
  const sections = [];

  if(options.hasKeyboard || options.hasPlayer){
    sections.push(createRuntimeState());
  }

  if(options.hasKeyboard){
    sections.push(createKeyboardBehavior());
  }

  if(options.hasIf){
    sections.push(createConditionBehavior());
  }

  if(options.hasTime){
    sections.push(createTimeBehavior());
  }

  return sections.join("\n\n");
}

function createRuntimeState(){
  return `
const output = document.getElementById("output");

const state = {
  x: 0,
  y: 0,
  z: 0,
  t: 0
};

function renderPlayer(){
  const player = document.getElementById("player");

  if(!player){
    return;
  }

  player.style.transform =
    "translate(" + state.x + "px," + state.y + "px)";
}

function showOutput(message){
  if(output){
    output.textContent = message;
  }
}
`;
}

function createKeyboardBehavior(){
  return `
function move(direction){
  const speed = 10;

  if(direction === "up"){
    state.y -= speed;
  }

  if(direction === "down"){
    state.y += speed;
  }

  if(direction === "left"){
    state.x -= speed;
  }

  if(direction === "right"){
    state.x += speed;
  }

  renderPlayer();

  showOutput(
    "MOVE " +
    direction.toUpperCase() +
    " | X:" + state.x +
    " Y:" + state.y
  );
}

function action(key){
  showOutput("ACTION " + key);
}

function handleKeyboardKey(key){
  const actions = {
    arrowup: () => move("up"),
    arrowdown: () => move("down"),
    arrowleft: () => move("left"),
    arrowright: () => move("right"),
    a: () => action("A"),
    b: () => action("B")
  };

  const selectedAction = actions[key];

  if(selectedAction){
    selectedAction();
  }
}

window.addEventListener("keydown", event => {
  handleKeyboardKey(event.key.toLowerCase());
});

document.querySelectorAll("[data-action]").forEach(button => {
  button.addEventListener("click", () => {
    const actionName = button.dataset.action;

    if(["up","down","left","right"].includes(actionName)){
      move(actionName);
      return;
    }

    action(actionName);
  });
});
`;
}

function createConditionBehavior(){
  return `
function evaluateCondition(){
  const conditionInput = "condition";

  return conditionInput.trim().length > 0;
}

if(evaluateCondition()){
  showOutput("IF condition satisfied");
}
`;
}

function createTimeBehavior(){
  return `
let previousTime = performance.now();

function updateTime(currentTime){
  const deltaTime = (currentTime - previousTime) / 1000;

  previousTime = currentTime;
  state.t += deltaTime;

  requestAnimationFrame(updateTime);
}

requestAnimationFrame(updateTime);
`;
}

function createTimeDescription(){
  return `
TIME ENGINE

T = elapsed runtime

STATE SPACE

X = horizontal
Y = vertical
Z = depth
T = time

Each animation frame performs one finite update:

state.t += deltaTime
`;
}

function build(){
  quantize();
  setStatus("BUILD COMPLETE");
}

function testBuild(){
  quantize();
  setStatus("TEST PASSED");
}

function updatePreview(html, css, js){
  const documentText = `
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
${css}
</style>
</head>
<body>
${html}
<script>
${js}
<\/script>
</body>
</html>
`;

  elements.preview.srcdoc = documentText;
}

function setStatus(text){
  elements.status.textContent = text;
}

function formatReportLine(line){
  const escaped = escapeHTML(line);

  if(line.includes("[PASS]")){
    return `<span class="pass">${escaped}</span>`;
  }

  if(line.includes("[WARN]")){
    return `<span class="warn">${escaped}</span>`;
  }

  if(line.includes("[FAIL]")){
    return `<span class="fail">${escaped}</span>`;
  }

  return escaped;
}

function escapeHTML(text){
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

document.querySelectorAll("[data-plugin]").forEach(button => {
  button.addEventListener("click", () => {
    insertPlugin(button.dataset.plugin);
  });
});

document.getElementById("quantizeButton")
  .addEventListener("click", quantize);

document.getElementById("buildButton")
  .addEventListener("click", build);

document.getElementById("testButton")
  .addEventListener("click", testBuild);

quantize();
</script>

</body>
</html>
